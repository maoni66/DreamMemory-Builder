name: Record DreamMemory Builder Run Result

on:
  push:
    branches:
      - main
    paths:
      - "build-report-request.txt"

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Builder repository
        uses: actions/checkout@v7

      - name: Resolve build request and inspect Actions run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID="$(awk -F': ' '/^Request ID:/ {print $2; exit}' build-report-request.txt)"
          BUILDER_SHA="$(awk -F': ' '/^Builder commit SHA:/ {print $2; exit}' build-report-request.txt)"
          test -n "$REQUEST_ID"
          [[ "$BUILDER_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          mkdir -p build-results
          python3 - "$REQUEST_ID" "$BUILDER_SHA" "$GH_REPOSITORY" > "build-results/$REQUEST_ID.json" <<'PY'
          import json, subprocess, sys
          request_id, builder_sha, repository = sys.argv[1:4]

          def gh(path):
              raw = subprocess.check_output(["gh", "api", path], text=True)
              return json.loads(raw)

          workflow = gh(f"repos/{repository}/actions/workflows/build-private-apk.yml")
          response = gh(
              f"repos/{repository}/actions/workflows/build-private-apk.yml/runs"
              f"?head_sha={builder_sha}&per_page=100"
          )
          runs = [
              run for run in response.get("workflow_runs", [])
              if run.get("head_sha", "").lower() == builder_sha.lower()
              and run.get("event") == "push"
          ]
          runs.sort(key=lambda run: (run.get("run_attempt", 1), run.get("id", 0)), reverse=True)
          selected = runs[0] if runs else None
          result = {
              "request_id": request_id,
              "builder_commit_sha": builder_sha,
              "workflow": {
                  "id": workflow.get("id"),
                  "name": workflow.get("name"),
                  "path": workflow.get("path"),
                  "state": workflow.get("state"),
                  "html_url": workflow.get("html_url"),
              },
              "run_found": selected is not None,
              "run": None,
              "jobs": [],
              "artifacts": [],
          }
          if selected:
              run_id = selected["id"]
              result["run"] = {
                  "id": run_id,
                  "run_number": selected.get("run_number"),
                  "run_attempt": selected.get("run_attempt"),
                  "event": selected.get("event"),
                  "status": selected.get("status"),
                  "conclusion": selected.get("conclusion"),
                  "head_sha": selected.get("head_sha"),
                  "created_at": selected.get("created_at"),
                  "updated_at": selected.get("updated_at"),
                  "html_url": selected.get("html_url"),
              }
              jobs = gh(f"repos/{repository}/actions/runs/{run_id}/jobs?per_page=100")
              result["jobs"] = [
                  {
                      "id": job.get("id"),
                      "name": job.get("name"),
                      "status": job.get("status"),
                      "conclusion": job.get("conclusion"),
                      "started_at": job.get("started_at"),
                      "completed_at": job.get("completed_at"),
                      "html_url": job.get("html_url"),
                  }
                  for job in jobs.get("jobs", [])
              ]
              artifacts = gh(f"repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100")
              result["artifacts"] = [
                  {
                      "id": artifact.get("id"),
                      "name": artifact.get("name"),
                      "expired": artifact.get("expired"),
                      "size_in_bytes": artifact.get("size_in_bytes"),
                      "created_at": artifact.get("created_at"),
                      "expires_at": artifact.get("expires_at"),
                  }
                  for artifact in artifacts.get("artifacts", [])
              ]
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Commit run report without retriggering the build
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID="$(awk -F': ' '/^Request ID:/ {print $2; exit}' build-report-request.txt)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "build-results/$REQUEST_ID.json"
          if git diff --cached --quiet; then
            echo "Build report is unchanged."
            exit 0
          fi
          git commit -m "chore: record Builder result for $REQUEST_ID"
          git push
