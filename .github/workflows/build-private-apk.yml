name: DreamMemory Private APK Builder

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreammemory-private-apk-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Checkout private DreamMemory source
        uses: actions/checkout@v7
        with:
          repository: maoni66/DreamMemory
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - name: Record source revision
        id: source
        shell: bash
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run JVM unit tests
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace --console=plain

      - name: Build debug APK
        shell: bash
        run: ./gradlew assembleDebug --stacktrace --console=plain

      # Keep signing material out of test and build steps.
      - name: Sign APK with existing DreamMemory debug key
        if: success()
        env:
          DREAMMEMORY_KEYSTORE_B64: ${{ secrets.DREAMMEMORY_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DREAMMEMORY_KEYSTORE_B64:-}" || { echo "Missing repository secret DREAMMEMORY_KEYSTORE_B64"; exit 1; }
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk" || { echo "APK not found: $apk"; exit 1; }
          printf '%s' "$DREAMMEMORY_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/dreammemory-debug.keystore"
          apksigner="$(find "$ANDROID_HOME/build-tools" -path '*/apksigner' -type f | sort -V | tail -n 1)"
          test -x "$apksigner" || { echo "apksigner not found"; exit 1; }
          "$apksigner" sign --ks "$RUNNER_TEMP/dreammemory-debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android "$apk"
          "$apksigner" verify --verbose "$apk"
          rm -f "$RUNNER_TEMP/dreammemory-debug.keystore"

      # The write token is exposed only in this final publishing step.
      - name: Publish APK to private DreamMemory release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "Missing repository secret PRIVATE_RELEASE_TOKEN"; exit 1; }
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk" || { echo "APK not found: $apk"; exit 1; }
          tag="build-${SOURCE_SHA}"
          gh release create "$tag" "$apk" \
            --repo maoni66/DreamMemory \
            --target "$SOURCE_SHA" \
            --title "DreamMemory build ${SOURCE_SHA:0:12}" \
            --notes "Automated private APK build from source commit ${SOURCE_SHA}. Unit tests passed and APK signature verification succeeded. Private release for DreamMemory."
