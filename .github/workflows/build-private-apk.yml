name: DreamMemory Private APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'build-request.txt'

permissions:
  contents: read

concurrency:
  group: dreammemory-private-apk-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      needs_build: ${{ steps.request.outputs.needs_build }}
    steps:
      - name: Checkout private DreamMemory source
        uses: actions/checkout@v7
        with:
          repository: maoni66/DreamMemory
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - name: Capture committed Room schema snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/committed-room-schemas"
          if [ -d app/schemas ]; then
            cp -a app/schemas/. "$RUNNER_TEMP/committed-room-schemas/"
          fi

      - name: Record source revision
        id: source
        shell: bash
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Honor explicit build request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          echo "needs_build=true" >> "$GITHUB_OUTPUT"
          echo "Explicit build requested; always run tests and produce a fresh APK, even if this source SHA has a prior release."

      - name: Set up JDK 17
        if: steps.request.outputs.needs_build == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml

      - name: Set up Android SDK
        if: steps.request.outputs.needs_build == 'true'
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        if: steps.request.outputs.needs_build == 'true'
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run JVM unit tests
        if: steps.request.outputs.needs_build == 'true'
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace --console=plain

      # Legacy migration tests were removed with the clean schema baseline.
      # Keep APK delivery independent from slow/unreliable emulator startup.
      - name: Build debug APK
        if: steps.request.outputs.needs_build == 'true'
        shell: bash
        run: ./gradlew assembleDebug --stacktrace --console=plain

      - name: Enforce Room schema version discipline
        if: steps.request.outputs.needs_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          schema_dir="app/schemas/com.dreammemory.app.data.local.DreamMemoryDatabase"
          generated="$(find "$schema_dir" -maxdepth 1 -type f -name '*.json' -print | sort -V | tail -n 1)"
          test -n "$generated" || { echo "Room schema JSON was not generated."; exit 1; }
          version="$(basename "$generated" .json)"
          committed_dir="$RUNNER_TEMP/committed-room-schemas/com.dreammemory.app.data.local.DreamMemoryDatabase"
          committed_current="$committed_dir/$version.json"

          if [ -f "$committed_current" ]; then
            if ! cmp -s "$committed_current" "$generated"; then
              echo "Room schema version $version changed without a version bump. Increase @Database.version and add/test a Migration; never rewrite an already released schema."
              exit 1
            fi
            echo "Committed Room schema v$version is unchanged."
          else
            existing_count="$(find "$RUNNER_TEMP/committed-room-schemas" -type f -name '*.json' -print | wc -l)"
            previous_version=$((version - 1))
            previous_schema="$committed_dir/$previous_version.json"
            if [ -f "$previous_schema" ]; then
              test -f app/src/test/java/com/dreammemory/app/data/local/DreamMemoryMigrationTest.kt || {
                echo "A new Room schema version requires DreamMemoryMigrationTest.kt to verify data-preserving upgrades."
                exit 1
              }
              echo "New Room schema v$version detected; the migration contract test has passed."
            elif [ "$existing_count" -eq 0 ]; then
              echo "Bootstrapping the first committed Room schema v$version."
            else
              echo "Room schema version $version does not follow the latest committed schema. Add sequential migrations and schema snapshots."
              exit 1
            fi
          fi

      # Room's generated schema is part of the release contract. Carry it encrypted
      # to the isolated publisher so it can be versioned in the private source repo.
      - name: Encrypt APK and Room schema for isolated publishing runner
        if: steps.request.outputs.needs_build == 'true'
        env:
          ARTIFACT_PASSWORD: ${{ secrets.DREAMMEMORY_ARTIFACT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_PASSWORD:-}" || { echo "Missing repository secret DREAMMEMORY_ARTIFACT_PASSWORD"; exit 1; }
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk" || { echo "APK not found: $apk"; exit 1; }
          test -n "$(find app/schemas -type f -name '*.json' -print -quit)" || { echo "Room schema snapshot missing; refusing release without a versioned database contract."; exit 1; }
          mkdir -p "$RUNNER_TEMP/dreammemory-transfer"
          tar -czf "$RUNNER_TEMP/dreammemory-transfer/dreammemory-package.tar.gz" "$apk" app/schemas
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$RUNNER_TEMP/dreammemory-transfer/dreammemory-package.tar.gz" \
            -out "$RUNNER_TEMP/dreammemory-transfer/dreammemory-package.enc" \
            -pass env:ARTIFACT_PASSWORD

      - name: Upload encrypted release package only
        if: steps.request.outputs.needs_build == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: encrypted-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dreammemory-transfer/dreammemory-package.enc
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: needs.build.outputs.needs_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # This is a fresh runner. It does not check out or execute project source code.
      - name: Download encrypted APK
        uses: actions/download-artifact@v6
        with:
          name: encrypted-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted

      - name: Decrypt APK and Room schema on isolated publishing runner
        env:
          ARTIFACT_PASSWORD: ${{ secrets.DREAMMEMORY_ARTIFACT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_PASSWORD:-}" || { echo "Missing repository secret DREAMMEMORY_ARTIFACT_PASSWORD"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -salt \
            -in "$RUNNER_TEMP/encrypted/dreammemory-package.enc" \
            -out "$RUNNER_TEMP/dreammemory-package.tar.gz" \
            -pass env:ARTIFACT_PASSWORD
          mkdir -p "$RUNNER_TEMP/package"
          tar -xzf "$RUNNER_TEMP/dreammemory-package.tar.gz" -C "$RUNNER_TEMP/package"
          apk_path="$(find "$RUNNER_TEMP/package" -type f -name app-debug.apk -print -quit)"
          schema_path="$(find "$RUNNER_TEMP/package" -type d -path '*/app/schemas' -print -quit)"
          test -n "$apk_path" && test -s "$apk_path" || { echo "APK missing from encrypted package"; exit 1; }
          test -n "$schema_path" && test -n "$(find "$schema_path" -type f -name '*.json' -print -quit)" || { echo "Room schema missing from encrypted package"; exit 1; }
          cp "$apk_path" "$RUNNER_TEMP/app-debug.apk"
          cp -a "$schema_path" "$RUNNER_TEMP/room-schemas"
          test -s "$RUNNER_TEMP/app-debug.apk"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;36.0.0"

      # Signing material is exposed only to this step, after project build code is gone.
      - name: Sign and verify APK
        env:
          DREAMMEMORY_KEYSTORE_B64: ${{ secrets.DREAMMEMORY_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DREAMMEMORY_KEYSTORE_B64:-}" || { echo "Missing repository secret DREAMMEMORY_KEYSTORE_B64"; exit 1; }
          printf '%s' "$DREAMMEMORY_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/dreammemory-debug.keystore"
          chmod 600 "$RUNNER_TEMP/dreammemory-debug.keystore"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$apksigner" || { echo "apksigner not found"; exit 1; }
          "$apksigner" sign --ks "$RUNNER_TEMP/dreammemory-debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android "$RUNNER_TEMP/app-debug.apk"
          "$apksigner" verify --verbose "$RUNNER_TEMP/app-debug.apk"
          rm -f "$RUNNER_TEMP/dreammemory-debug.keystore"

      # The release token is exposed only to the final publishing step.
      - name: Publish APK to private DreamMemory release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "Missing repository secret PRIVATE_RELEASE_TOKEN"; exit 1; }
          test -s "$RUNNER_TEMP/app-debug.apk" || { echo "Signed APK not found"; exit 1; }
          test -n "$(find "$RUNNER_TEMP/room-schemas" -type f -name '*.json' -print -quit)" || { echo "Room schema snapshots missing"; exit 1; }

          # The publisher runner never executes app build scripts. It only versions
          # generated JSON schema and refuses to attach it to a newer source SHA.
          gh auth setup-git
          gh repo clone maoni66/DreamMemory "$RUNNER_TEMP/source"
          current_sha="$(git -C "$RUNNER_TEMP/source" rev-parse HEAD)"
          if [ "$current_sha" != "$SOURCE_SHA" ]; then
            echo "Source main advanced during build (built $SOURCE_SHA, current $current_sha); refusing to publish a mismatched schema."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/source/app/schemas"
          cp -a "$RUNNER_TEMP/room-schemas/." "$RUNNER_TEMP/source/app/schemas/"
          git -C "$RUNNER_TEMP/source" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/source" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/source" add app/schemas
          if ! git -C "$RUNNER_TEMP/source" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/source" commit -m "chore(db): version Room schema for ${SOURCE_SHA:0:12} [skip ci]"
            git -C "$RUNNER_TEMP/source" push origin HEAD:main
          else
            echo "Room schema snapshots are already current."
          fi

          tag="build-${SOURCE_SHA:0:12}-${RUN_ID}-${RUN_ATTEMPT}"
          gh release create "$tag" "$RUNNER_TEMP/app-debug.apk" \
            --repo maoni66/DreamMemory \
            --target "$SOURCE_SHA" \
            --title "DreamMemory build ${SOURCE_SHA:0:12} (run ${RUN_ID}.${RUN_ATTEMPT})" \
            --notes "Automated private APK build from source commit ${SOURCE_SHA}. JVM unit tests passed; APK was password-encrypted during transfer, decrypted on an isolated runner, signed, and signature-verified. Private release for DreamMemory."
