name: DreamMemory Private APK Builder

# Automatic APK builds are triggered only by a build-request.txt commit in this public builder repo.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build-request.txt"

permissions:
  contents: read

concurrency:
  group: dreammemory-private-apk-builder
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_ref: ${{ steps.request.outputs.source_ref }}
      needs_build: ${{ steps.request.outputs.needs_build }}
      deliver_apk: ${{ steps.request.outputs.deliver_apk }}
    steps:
      - name: Checkout build request
        uses: actions/checkout@v7
        with:
          path: builder

      - name: Parse and validate requested source ref
        id: request
        shell: bash
        run: |
          set -euo pipefail
          source_ref="$(awk -F': ' '/^Source ref:/ {print $2; exit}' builder/build-request.txt)"
          source_ref="${source_ref:-main}"
          requested_source_sha="$(awk -F': ' '/^Source SHA:/ {print $2; exit}' builder/build-request.txt)"
          git check-ref-format --branch "$source_ref"
          case "$source_ref" in
            main|design/*|fix/*|work/*) ;;
            *) echo "Unsupported source ref: $source_ref"; exit 1 ;;
          esac
          if [[ ! "$requested_source_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Source SHA must be a full 40-character commit SHA."
            exit 1
          fi
          deliver_apk="$(awk -F': ' '/^Deliver APK:/ {print $2; exit}' builder/build-request.txt)"
          deliver_apk="${deliver_apk:-no}"
          case "$deliver_apk" in
            yes|no|verify) ;;
            *) echo "Deliver APK must be yes, no, or verify."; exit 1 ;;
          esac
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "requested_source_sha=$requested_source_sha" >> "$GITHUB_OUTPUT"
          echo "needs_build=true" >> "$GITHUB_OUTPUT"
          echo "deliver_apk=$deliver_apk" >> "$GITHUB_OUTPUT"
          echo "Explicit build requested for source ref: $source_ref at $requested_source_sha (deliver APK: $deliver_apk)"

      - name: Checkout private DreamMemory source
        uses: actions/checkout@v7
        with:
          repository: maoni66/DreamMemory
          ref: ${{ steps.request.outputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - name: Capture committed Room schema snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/committed-room-schemas"
          if [ -d app/schemas ]; then
            cp -a app/schemas/. "$RUNNER_TEMP/committed-room-schemas/"
          fi

      - name: Record source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          requested_sha="${{ steps.request.outputs.requested_source_sha }}"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Requested source SHA: $requested_sha"
          echo "Actual checked-out source SHA: $source_sha"
          if [[ ! "$requested_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Source SHA must be a full 40-character commit SHA."
            exit 1
          fi
          if [[ "$source_sha" != "$requested_sha" ]]; then
            echo "Source branch advanced or changed between request and checkout; refusing to validate the wrong revision."
            exit 1
          fi


      - name: Package exact source ZIP for private release
        if: steps.request.outputs.needs_build == 'true' && steps.request.outputs.deliver_apk != 'no'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-source.zip"
          git archive --format=zip --prefix="DreamMemory-$SOURCE_SHA/" "$SOURCE_SHA" > "$archive"
          unzip -t "$archive" >/dev/null
          test -s "$archive"

      - name: Set up JDK 17
        if: steps.request.outputs.needs_build == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml

      - name: Set up Android SDK
        if: steps.request.outputs.needs_build == 'true'
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        if: steps.request.outputs.needs_build == 'true'
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run JVM unit tests
        if: steps.request.outputs.needs_build == 'true'
        timeout-minutes: 10
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace --console=plain

      # Legacy migration tests were removed with the clean schema baseline.
      # Keep APK delivery independent from slow/unreliable emulator startup.
      - name: Build debug APK
        if: steps.request.outputs.needs_build == 'true'
        shell: bash
        run: ./gradlew assembleDebug --stacktrace --console=plain

      - name: Compile Android instrumented UI tests
        if: steps.request.outputs.needs_build == 'true'
        shell: bash
        run: ./gradlew assembleDebugAndroidTest --stacktrace --console=plain

      - name: Enable KVM for Android emulator
        if: steps.request.outputs.needs_build == 'true'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run Android instrumented UI tests on emulator
        if: steps.request.outputs.needs_build == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace --console=plain

      - name: Run Android UI tests at enlarged font scale and short portrait/landscape sizes
        if: steps.request.outputs.needs_build == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            adb shell settings put system font_scale 1.3
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 0
            adb shell wm density 320
            adb shell wm size 720x1280
            echo "Short portrait / font scale:"
            adb shell settings get system font_scale
            adb shell wm size
            ./gradlew connectedDebugAndroidTest --stacktrace --console=plain
            adb shell wm size 1280x720
            echo "Short landscape / font scale:"
            adb shell settings get system font_scale
            adb shell wm size
            ./gradlew connectedDebugAndroidTest --stacktrace --console=plain

      - name: Enforce Room schema version discipline
        if: steps.request.outputs.needs_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          schema_dir="app/schemas/com.dreammemory.app.data.local.DreamMemoryDatabase"
          generated="$(find "$schema_dir" -maxdepth 1 -type f -name '*.json' -print | sort -V | tail -n 1)"
          test -n "$generated" || { echo "Room schema JSON was not generated."; exit 1; }
          version="$(basename "$generated" .json)"
          committed_dir="$RUNNER_TEMP/committed-room-schemas/com.dreammemory.app.data.local.DreamMemoryDatabase"
          committed_current="$committed_dir/$version.json"

          if [ -f "$committed_current" ]; then
            # JSON whitespace/key ordering is not schema semantics; compare parsed content
            # so a compact but complete generated snapshot remains valid.
            if ! python3 -c 'import json,sys; n=lambda p: json.dumps(json.load(open(p, encoding="utf-8")), sort_keys=True, separators=(",", ":"), ensure_ascii=False); sys.exit(0 if n(sys.argv[1]) == n(sys.argv[2]) else 1)' "$committed_current" "$generated"; then
              echo "Room schema version $version changed without a version bump. Increase @Database.version and add/test a Migration; never rewrite an already released schema."
              exit 1
            fi
            echo "Committed Room schema v$version is unchanged (semantic JSON comparison)."
          else
            existing_count="$(find "$RUNNER_TEMP/committed-room-schemas" -type f -name '*.json' -print | wc -l)"
            previous_version=$((version - 1))
            previous_schema="$committed_dir/$previous_version.json"
            if [ -f "$previous_schema" ]; then
              test -f app/src/test/java/com/dreammemory/app/data/local/DreamMemoryMigrationTest.kt || {
                echo "A new Room schema version requires DreamMemoryMigrationTest.kt to verify data-preserving upgrades."
                exit 1
              }
              echo "New Room schema v$version detected; the migration contract test has passed."
            elif [ "$existing_count" -eq 0 ]; then
              echo "Bootstrapping the first committed Room schema v$version."
            else
              echo "Room schema version $version does not follow the latest committed schema. Add sequential migrations and schema snapshots."
              exit 1
            fi
          fi

      # Branch validation also needs the exact Room-generated JSON so the source
      # branch can commit the canonical snapshot before a second verification run.
      # Schema files contain structure only; never upload user data or APKs here.
      - name: Upload generated Room schema for branch review
        if: always() && steps.request.outputs.needs_build == 'true' && steps.request.outputs.source_ref != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-${{ steps.source.outputs.source_sha }}
          path: app/schemas/com.dreammemory.app.data.local.DreamMemoryDatabase/*.json
          if-no-files-found: warn
          retention-days: 7

      # Room's generated schema is part of the release contract. Carry it encrypted
      # to the isolated publisher so it can be versioned in the private source repo.
      - name: Encrypt APK, source ZIP and Room schema for isolated publishing runner
        if: steps.request.outputs.needs_build == 'true' && steps.request.outputs.deliver_apk != 'no'
        env:
          ARTIFACT_PASSWORD: ${{ secrets.DREAMMEMORY_ARTIFACT_PASSWORD }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_PASSWORD:-}" || { echo "Missing repository secret DREAMMEMORY_ARTIFACT_PASSWORD"; exit 1; }
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk" || { echo "APK not found: $apk"; exit 1; }
          test -n "$(find app/schemas -type f -name '*.json' -print -quit)" || { echo "Room schema snapshot missing; refusing release without a versioned database contract."; exit 1; }
          mkdir -p "$RUNNER_TEMP/dreammemory-transfer"
          source_zip="$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-source.zip"
          test -s "$source_zip" || { echo "Exact source ZIP is missing"; exit 1; }
          tar -czf "$RUNNER_TEMP/dreammemory-transfer/dreammemory-package.tar.gz" "$apk" app/schemas "$source_zip"
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$RUNNER_TEMP/dreammemory-transfer/dreammemory-package.tar.gz" \
            -out "$RUNNER_TEMP/dreammemory-transfer/dreammemory-package.enc" \
            -pass env:ARTIFACT_PASSWORD

      - name: Upload encrypted release package only
        if: steps.request.outputs.needs_build == 'true' && steps.request.outputs.deliver_apk != 'no'
        uses: actions/upload-artifact@v6
        with:
          name: encrypted-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dreammemory-transfer/dreammemory-package.enc
          if-no-files-found: error
          retention-days: 1

  deliver-private-branch-apk:
    needs: build
    if: needs.build.outputs.needs_build == 'true' && needs.build.outputs.source_ref != 'main' && needs.build.outputs.deliver_apk != 'no'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The publisher runner never checks out or executes project source code.
      - name: Download encrypted APK package
        uses: actions/download-artifact@v6
        with:
          name: encrypted-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Decrypt package and verify debug APK
        env:
          ARTIFACT_PASSWORD: ${{ secrets.DREAMMEMORY_ARTIFACT_PASSWORD }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_PASSWORD:-}" || { echo "Missing repository secret DREAMMEMORY_ARTIFACT_PASSWORD"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -salt \
            -in "$RUNNER_TEMP/encrypted/dreammemory-package.enc" \
            -out "$RUNNER_TEMP/dreammemory-package.tar.gz" \
            -pass env:ARTIFACT_PASSWORD
          mkdir -p "$RUNNER_TEMP/package"
          tar -xzf "$RUNNER_TEMP/dreammemory-package.tar.gz" -C "$RUNNER_TEMP/package"
          apk_path="$(find "$RUNNER_TEMP/package" -type f -name app-debug.apk -print -quit)"
          schema_path="$(find "$RUNNER_TEMP/package" -type f -name '*.json' -path '*/app/schemas/*' -print -quit)"
          source_zip="$(find "$RUNNER_TEMP/package" -type f -name "DreamMemory-$SOURCE_SHA-source.zip" -print -quit)"
          test -n "$apk_path" && test -s "$apk_path" || { echo "APK missing from encrypted package"; exit 1; }
          test -n "$schema_path" && test -s "$schema_path" || { echo "Room schema missing from encrypted package"; exit 1; }
          test -n "$source_zip" && test -s "$source_zip" || { echo "Source ZIP missing from encrypted package"; exit 1; }
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -x "$apksigner" ]; then
            yes | sdkmanager --licenses > /dev/null || true
            sdkmanager "build-tools;36.0.0"
          fi
          "$apksigner" verify --verbose "$apk_path"
          cp "$apk_path" "$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-debug.apk"
          cp "$source_zip" "$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-source.zip"

      - name: Publish APK to private source repository release
        if: needs.build.outputs.deliver_apk == 'yes'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "Missing repository secret PRIVATE_RELEASE_TOKEN"; exit 1; }
          apk="$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-debug.apk"
          test -s "$apk" || { echo "Verified debug APK is missing"; exit 1; }
          tag="private-test-${SOURCE_SHA:0:12}-${RUN_ID}-${RUN_ATTEMPT}"
          source_zip="$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-source.zip"
          test -s "$source_zip" || { echo "Verified source ZIP is missing"; exit 1; }
          gh release create "$tag" "$apk" "$source_zip" \
            --repo maoni66/DreamMemory \
            --target "$SOURCE_SHA" \
            --title "DreamMemory private test APK ${SOURCE_SHA:0:12}" \
            --notes "Private test build from exact source commit $SOURCE_SHA. This is an installable Android Debug APK produced by assembleDebug and verified on the isolated delivery runner. It is not a release-signed production build. No source branch or main-branch writes were performed by this delivery job."
  
  verify-main-apk:
    needs: build
    if: needs.build.outputs.needs_build == 'true' && needs.build.outputs.source_ref == 'main' && needs.build.outputs.deliver_apk == 'verify'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download encrypted APK package
        uses: actions/download-artifact@v6
        with:
          name: encrypted-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Decrypt package and verify APK without publishing
        env:
          ARTIFACT_PASSWORD: ${{ secrets.DREAMMEMORY_ARTIFACT_PASSWORD }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_PASSWORD:-}" || { echo "Missing repository secret DREAMMEMORY_ARTIFACT_PASSWORD"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -salt \
            -in "$RUNNER_TEMP/encrypted/dreammemory-package.enc" \
            -out "$RUNNER_TEMP/dreammemory-package.tar.gz" \
            -pass env:ARTIFACT_PASSWORD
          mkdir -p "$RUNNER_TEMP/package"
          tar -xzf "$RUNNER_TEMP/dreammemory-package.tar.gz" -C "$RUNNER_TEMP/package"
          apk_path="$(find "$RUNNER_TEMP/package" -type f -name app-debug.apk -print -quit)"
          schema_path="$(find "$RUNNER_TEMP/package" -type f -name '*.json' -path '*/app/schemas/*' -print -quit)"
          test -n "$apk_path" && test -s "$apk_path" || { echo "APK missing from encrypted package"; exit 1; }
          test -n "$schema_path" && test -s "$schema_path" || { echo "Room schema missing from encrypted package"; exit 1; }
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;36.0.0"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk_path"
          echo "Verified non-published main-branch APK for source SHA $SOURCE_SHA"

  publish:
    needs: build
    if: needs.build.outputs.needs_build == 'true' && needs.build.outputs.source_ref == 'main' && needs.build.outputs.deliver_apk == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # This is a fresh runner. It does not check out or execute project source code.
      - name: Download encrypted APK
        uses: actions/download-artifact@v6
        with:
          name: encrypted-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted

      - name: Decrypt APK and Room schema on isolated publishing runner
        env:
          ARTIFACT_PASSWORD: ${{ secrets.DREAMMEMORY_ARTIFACT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_PASSWORD:-}" || { echo "Missing repository secret DREAMMEMORY_ARTIFACT_PASSWORD"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -salt \
            -in "$RUNNER_TEMP/encrypted/dreammemory-package.enc" \
            -out "$RUNNER_TEMP/dreammemory-package.tar.gz" \
            -pass env:ARTIFACT_PASSWORD
          mkdir -p "$RUNNER_TEMP/package"
          tar -xzf "$RUNNER_TEMP/dreammemory-package.tar.gz" -C "$RUNNER_TEMP/package"
          apk_path="$(find "$RUNNER_TEMP/package" -type f -name app-debug.apk -print -quit)"
          schema_path="$(find "$RUNNER_TEMP/package" -type d -path '*/app/schemas' -print -quit)"
          source_zip="$(find "$RUNNER_TEMP/package" -type f -name "DreamMemory-$SOURCE_SHA-source.zip" -print -quit)"
          test -n "$apk_path" && test -s "$apk_path" || { echo "APK missing from encrypted package"; exit 1; }
          test -n "$schema_path" && test -n "$(find "$schema_path" -type f -name '*.json' -print -quit)" || { echo "Room schema missing from encrypted package"; exit 1; }
          test -n "$source_zip" && test -s "$source_zip" || { echo "Source ZIP missing from encrypted package"; exit 1; }
          cp "$apk_path" "$RUNNER_TEMP/app-debug.apk"
          cp "$source_zip" "$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-source.zip"
          cp -a "$schema_path" "$RUNNER_TEMP/room-schemas"
          test -s "$RUNNER_TEMP/app-debug.apk"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;36.0.0"

      # Signing material is exposed only to this step, after project build code is gone.
      - name: Sign and verify APK
        env:
          DREAMMEMORY_KEYSTORE_B64: ${{ secrets.DREAMMEMORY_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DREAMMEMORY_KEYSTORE_B64:-}" || { echo "Missing repository secret DREAMMEMORY_KEYSTORE_B64"; exit 1; }
          printf '%s' "$DREAMMEMORY_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/dreammemory-debug.keystore"
          chmod 600 "$RUNNER_TEMP/dreammemory-debug.keystore"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$apksigner" || { echo "apksigner not found"; exit 1; }
          "$apksigner" sign --ks "$RUNNER_TEMP/dreammemory-debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android "$RUNNER_TEMP/app-debug.apk"
          "$apksigner" verify --verbose "$RUNNER_TEMP/app-debug.apk"
          rm -f "$RUNNER_TEMP/dreammemory-debug.keystore"

      # The release token is exposed only to the final publishing step.
      - name: Publish APK to private DreamMemory release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "Missing repository secret PRIVATE_RELEASE_TOKEN"; exit 1; }
          test -s "$RUNNER_TEMP/app-debug.apk" || { echo "Signed APK not found"; exit 1; }
          test -n "$(find "$RUNNER_TEMP/room-schemas" -type f -name '*.json' -print -quit)" || { echo "Room schema snapshots missing"; exit 1; }

          # The publisher runner never executes app build scripts. It only versions
          # generated JSON schema and refuses to attach it to a newer source SHA.
          gh auth setup-git
          gh repo clone maoni66/DreamMemory "$RUNNER_TEMP/source"
          current_sha="$(git -C "$RUNNER_TEMP/source" rev-parse HEAD)"
          if [ "$current_sha" != "$SOURCE_SHA" ]; then
            echo "Source main advanced during build (built $SOURCE_SHA, current $current_sha); refusing to publish a mismatched schema."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/source/app/schemas"
          cp -a "$RUNNER_TEMP/room-schemas/." "$RUNNER_TEMP/source/app/schemas/"
          git -C "$RUNNER_TEMP/source" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/source" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/source" add app/schemas
          if ! git -C "$RUNNER_TEMP/source" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/source" commit -m "chore(db): version Room schema for ${SOURCE_SHA:0:12} [skip ci]"
            git -C "$RUNNER_TEMP/source" push origin HEAD:main
          else
            echo "Room schema snapshots are already current."
          fi

          tag="build-${SOURCE_SHA:0:12}-${RUN_ID}-${RUN_ATTEMPT}"
          gh release create "$tag" "$RUNNER_TEMP/app-debug.apk" "$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-source.zip" \
            --repo maoni66/DreamMemory \
            --target "$SOURCE_SHA" \
            --title "DreamMemory build ${SOURCE_SHA:0:12} (run ${RUN_ID}.${RUN_ATTEMPT})" \
            --notes "Automated private APK build from source commit ${SOURCE_SHA}. JVM unit tests passed; APK was password-encrypted during transfer, decrypted on an isolated runner, signed, and signature-verified. Private release for DreamMemory."
