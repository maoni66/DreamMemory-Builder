name: DreamMemory Private APK Builder

# Automatic APK builds are triggered only by a build-request.txt commit in this public builder repo.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build-request.txt"

permissions:
  contents: read

concurrency:
  group: dreammemory-private-apk-builder
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_ref: ${{ steps.request.outputs.source_ref }}
      needs_build: ${{ steps.request.outputs.needs_build }}
      deliver_apk: ${{ steps.request.outputs.deliver_apk }}
    steps:
      - name: Checkout build request
        uses: actions/checkout@v7
        with:
          path: builder

      - name: Parse and validate requested source ref
        id: request
        shell: bash
        run: |
          set -euo pipefail
          source_ref="$(awk -F': ' '/^Source ref:/ {print $2; exit}' builder/build-request.txt)"
          source_ref="${source_ref:-main}"
          requested_source_sha="$(awk -F': ' '/^Source SHA:/ {print $2; exit}' builder/build-request.txt)"
          git check-ref-format --branch "$source_ref"
          case "$source_ref" in
            main|design/*|fix/*|refactor/*|work/*|rebuild/clean-room|rebuild/dm-product-baseline) ;;
            *) echo "Unsupported source ref: $source_ref"; exit 1 ;;
          esac
          if [[ ! "$requested_source_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Source SHA must be a full 40-character commit SHA."
            exit 1
          fi
          deliver_apk="$(awk -F': ' '/^Deliver APK:/ {print $2; exit}' builder/build-request.txt)"
          deliver_apk="${deliver_apk:-no}"
          case "$deliver_apk" in
            yes|no|verify) ;;
            *) echo "Deliver APK must be yes, no, or verify."; exit 1 ;;
          esac
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "requested_source_sha=$requested_source_sha" >> "$GITHUB_OUTPUT"
          echo "needs_build=true" >> "$GITHUB_OUTPUT"
          echo "deliver_apk=$deliver_apk" >> "$GITHUB_OUTPUT"
          echo "Explicit build requested for source ref: $source_ref at $requested_source_sha (deliver APK: $deliver_apk)"

      - name: Preserve short-screen matrix script before source checkout
        shell: bash
        run: cp builder/scripts/short-screen-matrix.sh "$RUNNER_TEMP/short-screen-matrix.sh"

      - name: Checkout private DreamMemory source
        uses: actions/checkout@v7
        with:
          repository: maoni66/DreamMemory
          ref: ${{ steps.request.outputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - name: Capture committed Room schema snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/committed-room-schemas"
          if [ -d app/schemas ]; then
            cp -a app/schemas/. "$RUNNER_TEMP/committed-room-schemas/"
          fi

      - name: Record source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          requested_sha="${{ steps.request.outputs.requested_source_sha }}"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Requested source SHA: $requested_sha"
          echo "Actual checked-out source SHA: $source_sha"
          if [[ ! "$requested_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Source SHA must be a full 40-character commit SHA."
            exit 1
          fi
          if [[ "$source_sha" != "$requested_sha" ]]; then
            echo "Source branch advanced or changed between request and checkout; refusing to validate the wrong revision."
            exit 1
          fi


      - name: Package exact source ZIP for private release
        if: steps.request.outputs.needs_build == 'true' && steps.request.outputs.deliver_apk != 'no'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-source.zip"
          git archive --format=zip --prefix="DreamMemory-$SOURCE_SHA/" "$SOURCE_SHA" > "$archive"
          unzip -t "$archive" >/dev/null
          test -s "$archive"

      - name: Set up JDK 17
        if: steps.request.outputs.needs_build == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml

      - name: Set up Gradle 9.4.1 (source repository has no Gradle Wrapper)
        if: steps.request.outputs.needs_build == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1

      - name: Set up Android SDK
        if: steps.request.outputs.needs_build == 'true'
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        if: steps.request.outputs.needs_build == 'true'
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run JVM unit tests
        if: steps.request.outputs.needs_build == 'true'
        timeout-minutes: 10
        shell: bash
        run: |
          gradle testDebugUnitTest --stacktrace --console=plain

      # Legacy migration tests were removed with the clean schema baseline.
      # Keep APK delivery independent from slow/unreliable emulator startup.
      - name: Build debug APK
        if: steps.request.outputs.needs_build == 'true'
        shell: bash
        run: gradle assembleDebug --stacktrace --console=plain

      - name: Set up Gradle 9.6.0 for isolated database validation spike
        if: steps.request.outputs.needs_build == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build isolated Android database host and Room 2.8.5 KSP candidate
        if: steps.request.outputs.needs_build == 'true'
        working-directory: spikes/android-db-validation
        shell: bash
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace --console=plain
          gradle --no-daemon :room2:assembleDebug :room2:kspDebugKotlin --stacktrace --console=plain

      - name: Restore Gradle 9.4.1 for existing source-repository instrumentation tests
        if: steps.request.outputs.needs_build == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Compile Android instrumented UI tests
        if: steps.request.outputs.needs_build == 'true'
        shell: bash
        run: gradle assembleDebugAndroidTest --stacktrace --console=plain

      - name: Enable KVM for Android emulator
        if: steps.request.outputs.needs_build == 'true'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run Android instrumented UI tests on emulator
        if: steps.request.outputs.needs_build == 'true'
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle connectedDebugAndroidTest --stacktrace --console=plain

      - name: Run Android UI tests at enlarged font scale and short portrait/landscape sizes
        if: steps.request.outputs.needs_build == 'true'
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          # Keep the action input single-line; run the POSIX matrix from a checked-in script.
          script: sh "$RUNNER_TEMP/short-screen-matrix.sh"

      # Clean-room AppDatabase currently declares exportSchema=false; schema snapshot
      # enforcement is intentionally deferred until a versioned schema baseline and
      # migration contract tests are introduced. Do not validate the legacy database path.

      - name: Encrypt APK and source ZIP for isolated publishing runner
        if: steps.request.outputs.needs_build == 'true' && steps.request.outputs.deliver_apk != 'no'
        env:
          ARTIFACT_PASSWORD: ${{ secrets.DREAMMEMORY_ARTIFACT_PASSWORD }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_PASSWORD:-}" || { echo "Missing repository secret DREAMMEMORY_ARTIFACT_PASSWORD"; exit 1; }
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk" || { echo "APK not found: $apk"; exit 1; }
          mkdir -p "$RUNNER_TEMP/dreammemory-transfer"
          source_zip="$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-source.zip"
          test -s "$source_zip" || { echo "Exact source ZIP is missing"; exit 1; }
          tar -czf "$RUNNER_TEMP/dreammemory-transfer/dreammemory-package.tar.gz" "$apk" "$source_zip"
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$RUNNER_TEMP/dreammemory-transfer/dreammemory-package.tar.gz" \
            -out "$RUNNER_TEMP/dreammemory-transfer/dreammemory-package.enc" \
            -pass env:ARTIFACT_PASSWORD

      - name: Upload encrypted release package only
        if: steps.request.outputs.needs_build == 'true' && steps.request.outputs.deliver_apk != 'no'
        uses: actions/upload-artifact@v6
        with:
          name: encrypted-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dreammemory-transfer/dreammemory-package.enc
          if-no-files-found: error
          retention-days: 1

  deliver-private-branch-apk:
    needs: build
    if: needs.build.outputs.needs_build == 'true' && needs.build.outputs.source_ref != 'main' && needs.build.outputs.deliver_apk != 'no'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The publisher runner never checks out or executes project source code.
      - name: Download encrypted APK package
        uses: actions/download-artifact@v6
        with:
          name: encrypted-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Decrypt package, apply stable test signature and verify debug APK
        env:
          ARTIFACT_PASSWORD: ${{ secrets.DREAMMEMORY_ARTIFACT_PASSWORD }}
          DREAMMEMORY_KEYSTORE_B64: ${{ secrets.DREAMMEMORY_KEYSTORE_B64 }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_PASSWORD:-}" || { echo "Missing repository secret DREAMMEMORY_ARTIFACT_PASSWORD"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -salt \
            -in "$RUNNER_TEMP/encrypted/dreammemory-package.enc" \
            -out "$RUNNER_TEMP/dreammemory-package.tar.gz" \
            -pass env:ARTIFACT_PASSWORD
          mkdir -p "$RUNNER_TEMP/package"
          tar -xzf "$RUNNER_TEMP/dreammemory-package.tar.gz" -C "$RUNNER_TEMP/package"
          apk_path="$(find "$RUNNER_TEMP/package" -type f -name app-debug.apk -print -quit)"
          source_zip="$(find "$RUNNER_TEMP/package" -type f -name "DreamMemory-$SOURCE_SHA-source.zip" -print -quit)"
          test -n "$apk_path" && test -s "$apk_path" || { echo "APK missing from encrypted package"; exit 1; }
          test -n "$source_zip" && test -s "$source_zip" || { echo "Source ZIP missing from encrypted package"; exit 1; }
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -x "$apksigner" ]; then
            yes | sdkmanager --licenses > /dev/null || true
            sdkmanager "build-tools;36.0.0"
          fi
          test -n "${DREAMMEMORY_KEYSTORE_B64:-}" || { echo "Missing repository secret DREAMMEMORY_KEYSTORE_B64"; exit 1; }
          printf '%s' "$DREAMMEMORY_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/dreammemory-debug.keystore"
          chmod 600 "$RUNNER_TEMP/dreammemory-debug.keystore"
          "$apksigner" sign --ks "$RUNNER_TEMP/dreammemory-debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android "$apk_path"
          "$apksigner" verify --verbose "$apk_path"
          rm -f "$RUNNER_TEMP/dreammemory-debug.keystore"
          cp "$apk_path" "$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-debug.apk"
          cp "$source_zip" "$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-source.zip"

      - name: Publish APK to private source repository release
        if: needs.build.outputs.deliver_apk == 'yes'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "Missing repository secret PRIVATE_RELEASE_TOKEN"; exit 1; }
          apk="$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-debug.apk"
          test -s "$apk" || { echo "Verified debug APK is missing"; exit 1; }
          tag="private-test-${SOURCE_SHA:0:12}-${RUN_ID}-${RUN_ATTEMPT}"
          source_zip="$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-source.zip"
          test -s "$source_zip" || { echo "Verified source ZIP is missing"; exit 1; }
          gh release create "$tag" "$apk" "$source_zip" \
            --repo maoni66/DreamMemory \
            --target "$SOURCE_SHA" \
            --title "DreamMemory private test APK ${SOURCE_SHA:0:12}" \
            --notes "Private test build from exact source commit $SOURCE_SHA. This is an installable Android Debug APK produced by assembleDebug and verified on the isolated delivery runner. It is not a release-signed production build. No source branch or main-branch writes were performed by this delivery job."
  
  verify-main-apk:
    needs: build
    if: needs.build.outputs.needs_build == 'true' && needs.build.outputs.source_ref == 'main' && needs.build.outputs.deliver_apk == 'verify'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download encrypted APK package
        uses: actions/download-artifact@v6
        with:
          name: encrypted-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Decrypt package and verify APK without publishing
        env:
          ARTIFACT_PASSWORD: ${{ secrets.DREAMMEMORY_ARTIFACT_PASSWORD }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_PASSWORD:-}" || { echo "Missing repository secret DREAMMEMORY_ARTIFACT_PASSWORD"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -salt \
            -in "$RUNNER_TEMP/encrypted/dreammemory-package.enc" \
            -out "$RUNNER_TEMP/dreammemory-package.tar.gz" \
            -pass env:ARTIFACT_PASSWORD
          mkdir -p "$RUNNER_TEMP/package"
          tar -xzf "$RUNNER_TEMP/dreammemory-package.tar.gz" -C "$RUNNER_TEMP/package"
          apk_path="$(find "$RUNNER_TEMP/package" -type f -name app-debug.apk -print -quit)"
          schema_path="$(find "$RUNNER_TEMP/package" -type f -name '*.json' -path '*/app/schemas/*' -print -quit)"
          test -n "$apk_path" && test -s "$apk_path" || { echo "APK missing from encrypted package"; exit 1; }
          test -n "$schema_path" && test -s "$schema_path" || { echo "Room schema missing from encrypted package"; exit 1; }
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;36.0.0"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk_path"
          echo "Verified non-published main-branch APK for source SHA $SOURCE_SHA"

  publish:
    needs: build
    if: needs.build.outputs.needs_build == 'true' && needs.build.outputs.source_ref == 'main' && needs.build.outputs.deliver_apk == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # This is a fresh runner. It does not check out or execute project source code.
      - name: Download encrypted APK
        uses: actions/download-artifact@v6
        with:
          name: encrypted-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted

      - name: Decrypt APK and Room schema on isolated publishing runner
        env:
          ARTIFACT_PASSWORD: ${{ secrets.DREAMMEMORY_ARTIFACT_PASSWORD }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_PASSWORD:-}" || { echo "Missing repository secret DREAMMEMORY_ARTIFACT_PASSWORD"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -salt \
            -in "$RUNNER_TEMP/encrypted/dreammemory-package.enc" \
            -out "$RUNNER_TEMP/dreammemory-package.tar.gz" \
            -pass env:ARTIFACT_PASSWORD
          mkdir -p "$RUNNER_TEMP/package"
          tar -xzf "$RUNNER_TEMP/dreammemory-package.tar.gz" -C "$RUNNER_TEMP/package"
          apk_path="$(find "$RUNNER_TEMP/package" -type f -name app-debug.apk -print -quit)"
          source_zip="$(find "$RUNNER_TEMP/package" -type f -name "DreamMemory-$SOURCE_SHA-source.zip" -print -quit)"
          test -n "$apk_path" && test -s "$apk_path" || { echo "APK missing from encrypted package"; exit 1; }
          test -n "$source_zip" && test -s "$source_zip" || { echo "Source ZIP missing from encrypted package"; exit 1; }
          cp "$apk_path" "$RUNNER_TEMP/app-debug.apk"
          cp "$source_zip" "$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-source.zip"
          test -s "$RUNNER_TEMP/app-debug.apk"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;36.0.0"

      # Signing material is exposed only to this step, after project build code is gone.
      - name: Sign and verify APK
        env:
          DREAMMEMORY_KEYSTORE_B64: ${{ secrets.DREAMMEMORY_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DREAMMEMORY_KEYSTORE_B64:-}" || { echo "Missing repository secret DREAMMEMORY_KEYSTORE_B64"; exit 1; }
          printf '%s' "$DREAMMEMORY_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/dreammemory-debug.keystore"
          chmod 600 "$RUNNER_TEMP/dreammemory-debug.keystore"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$apksigner" || { echo "apksigner not found"; exit 1; }
          "$apksigner" sign --ks "$RUNNER_TEMP/dreammemory-debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android "$RUNNER_TEMP/app-debug.apk"
          "$apksigner" verify --verbose "$RUNNER_TEMP/app-debug.apk"
          rm -f "$RUNNER_TEMP/dreammemory-debug.keystore"

      # The release token is exposed only to the final publishing step.
      - name: Publish APK to private DreamMemory release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "Missing repository secret PRIVATE_RELEASE_TOKEN"; exit 1; }
          test -s "$RUNNER_TEMP/app-debug.apk" || { echo "Signed APK not found"; exit 1; }

          # The publisher runner never executes project build scripts. It only publishes
          # the already-built, signed APK and exact source archive.
          tag="build-${SOURCE_SHA:0:12}-${RUN_ID}-${RUN_ATTEMPT}"
          gh release create "$tag" "$RUNNER_TEMP/app-debug.apk" "$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-source.zip" \
            --repo maoni66/DreamMemory \
            --target "$SOURCE_SHA" \
            --title "DreamMemory build ${SOURCE_SHA:0:12} (run ${RUN_ID}.${RUN_ATTEMPT})" \
            --notes "Automated private APK build from source commit ${SOURCE_SHA}. JVM unit tests passed; APK was password-encrypted during transfer, decrypted on an isolated runner, signed, and signature-verified. Private release for DreamMemory."
