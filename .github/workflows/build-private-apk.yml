name: DreamMemory Private APK Builder

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreammemory-private-apk-builder
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout private DreamMemory source
        uses: actions/checkout@v7
        with:
          repository: maoni66/DreamMemory
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Run JVM unit tests
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace --console=plain

      - name: Build APK
        shell: bash
        run: ./gradlew assembleDebug --stacktrace --console=plain

      # Signing is intentionally isolated as the final step.
      # Do not add secrets to earlier build/test steps.
      - name: Sign and publish APK
        if: success()
        env:
          DREAMMEMORY_KEYSTORE_B64: ${{ secrets.DREAMMEMORY_KEYSTORE_B64 }}
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DREAMMEMORY_KEYSTORE_B64:-}" || { echo "Missing keystore secret"; exit 1; }
          test -n "${GH_TOKEN:-}" || { echo "Missing release token"; exit 1; }
          printf '%s' "$DREAMMEMORY_KEYSTORE_B64" | base64 --decode > dreammemory.keystore
          apksigner="$(find "$ANDROID_HOME/build-tools" -path '*/apksigner' -type f | sort -V | tail -n 1)"
          "$apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          rm -f dreammemory.keystore
