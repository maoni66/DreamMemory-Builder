name: DreamMemory Private APK Builder

# Automatic APK builds are triggered only by a build-request.txt commit in this public builder repo.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build-request.txt"

permissions:
  contents: read

concurrency:
  group: dreammemory-private-apk-builder
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_ref: ${{ steps.request.outputs.source_ref }}
      needs_build: ${{ steps.request.outputs.needs_build }}
      deliver_apk: ${{ steps.request.outputs.deliver_apk }}
      validation_scope: ${{ steps.request.outputs.validation_scope }}
      instrumentation_class: ${{ steps.request.outputs.instrumentation_class }}
    steps:
      - name: Checkout build request
        uses: actions/checkout@v7
        with:
          path: builder

      - name: Parse and validate requested source ref
        id: request
        shell: bash
        run: |
          set -euo pipefail
          source_ref="$(awk -F': ' '/^Source ref:/ {print $2; exit}' builder/build-request.txt)"
          source_ref="${source_ref:-main}"
          requested_source_sha="$(awk -F': ' '/^Source SHA:/ {print $2; exit}' builder/build-request.txt)"
          git check-ref-format --branch "$source_ref"
          case "$source_ref" in
            main|design/*|feature/*|fix/*|refactor/*|work/*|rebuild/clean-room|rebuild/dm-product-baseline) ;;
            *) echo "Unsupported source ref: $source_ref"; exit 1 ;;
          esac
          if [[ ! "$requested_source_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Source SHA must be a full 40-character commit SHA."
            exit 1
          fi
          validation_scope="$(awk -F': ' '/^Validation scope:/ {print $2; exit}' builder/build-request.txt)"
          validation_scope="${validation_scope:-full}"
          case "$validation_scope" in
            database|quick|app|full) ;;
            *) echo "Validation scope must be database, quick, app, or full."; exit 1 ;;
          esac
          echo "validation_scope=$validation_scope" >> "$GITHUB_OUTPUT"
          instrumentation_class="$(awk -F': ' '/^Instrumentation class:/ {print $2; exit}' builder/build-request.txt)"
          instrumentation_class="${instrumentation_class:-}"
          if [[ -n "$instrumentation_class" && ! "$instrumentation_class" =~ ^[A-Za-z0-9_.#]+$ ]]; then
            echo "Invalid instrumentation class selector: $instrumentation_class"
            exit 1
          fi
          echo "instrumentation_class=$instrumentation_class" >> "$GITHUB_OUTPUT"
          deliver_apk="$(awk -F': ' '/^Deliver APK:/ {print $2; exit}' builder/build-request.txt)"
          deliver_apk="${deliver_apk:-no}"
          if [[ "$validation_scope" == "quick" || "$validation_scope" == "database" ]] && [[ "$deliver_apk" != "no" ]]; then
            echo "Quick/database validation cannot deliver an APK; set Deliver APK: no."
            exit 1
          fi
          case "$deliver_apk" in
            yes|no|verify) ;;
            *) echo "Deliver APK must be yes, no, or verify."; exit 1 ;;
          esac
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "requested_source_sha=$requested_source_sha" >> "$GITHUB_OUTPUT"
          echo "needs_build=true" >> "$GITHUB_OUTPUT"
          echo "deliver_apk=$deliver_apk" >> "$GITHUB_OUTPUT"
          echo "Explicit build requested for source ref: $source_ref at $requested_source_sha (scope: $validation_scope, deliver APK: $deliver_apk)"

      - name: Preserve short-screen matrix script before source checkout
        shell: bash
        run: cp builder/scripts/short-screen-matrix.sh "$RUNNER_TEMP/short-screen-matrix.sh"

      - name: Checkout private DreamMemory source
        uses: actions/checkout@v7
        with:
          repository: maoni66/DreamMemory
          # Build the immutable requested commit, not the moving branch head.
          ref: ${{ steps.request.outputs.requested_source_sha }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - name: Capture committed Room schema snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/committed-room-schemas"
          if [ -d dm-app/schemas ]; then
            cp -a dm-app/schemas/. "$RUNNER_TEMP/committed-room-schemas/"
          fi

      - name: Record source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          requested_sha="${{ steps.request.outputs.requested_source_sha }}"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Requested source SHA: $requested_sha"
          echo "Actual checked-out source SHA: $source_sha"
          if [[ ! "$requested_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Source SHA must be a full 40-character commit SHA."
            exit 1
          fi
          if [[ "$source_sha" != "$requested_sha" ]]; then
            echo "Checked-out commit does not match the immutable requested Source SHA; refusing to validate the wrong revision."
            exit 1
          fi


      - name: Package exact source ZIP for private release
        if: steps.request.outputs.needs_build == 'true' && steps.request.outputs.deliver_apk != 'no'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-source.zip"
          git archive --format=zip --prefix="DreamMemory-$SOURCE_SHA/" "$SOURCE_SHA" > "$archive"
          unzip -t "$archive" >/dev/null
          test -s "$archive"

      - name: Set up JDK 17
        if: steps.request.outputs.needs_build == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml

      - name: Set up Gradle 9.4.1 (source repository has no Gradle Wrapper)
        if: steps.request.outputs.needs_build == 'true' && steps.request.outputs.validation_scope != 'database'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1

      - name: Set up Android SDK
        if: steps.request.outputs.needs_build == 'true'
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        if: steps.request.outputs.needs_build == 'true'
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run JVM unit tests
        if: steps.request.outputs.needs_build == 'true' && steps.request.outputs.validation_scope != 'database'
        timeout-minutes: 10
        shell: bash
        run: |
          gradle :dm-app:testDebugUnitTest --stacktrace --console=plain

      # Legacy migration tests were removed with the clean schema baseline.
      # Keep APK delivery independent from slow/unreliable emulator startup.
      - name: Build debug APK
        if: steps.request.outputs.needs_build == 'true' && steps.request.outputs.validation_scope != 'database'
        shell: bash
        run: gradle :dm-app:assembleDebug --stacktrace --console=plain

      - name: Set up Gradle 9.6.0 for Room 2.8.5 validation spike
        if: steps.request.outputs.needs_build == 'true' && (steps.request.outputs.validation_scope == 'full' || steps.request.outputs.validation_scope == 'database')
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build isolated Room 2.8.5 Android database validation
        if: steps.request.outputs.needs_build == 'true' && (steps.request.outputs.validation_scope == 'full' || steps.request.outputs.validation_scope == 'database')
        working-directory: spikes/android-db-validation
        shell: bash
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace --console=plain
          gradle --no-daemon :room2:assembleDebug :room2:kspDebugKotlin :room2:assembleDebugAndroidTest --stacktrace --console=plain

      - name: Enable KVM for Room 2.8.5 Android database tests
        if: steps.request.outputs.needs_build == 'true' && (steps.request.outputs.validation_scope == 'full' || steps.request.outputs.validation_scope == 'database')
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run Room 2.8.5 Android SQLite runtime validation
        if: steps.request.outputs.needs_build == 'true' && (steps.request.outputs.validation_scope == 'full' || steps.request.outputs.validation_scope == 'database')
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: spikes/android-db-validation
          script: |
            gradle :room2:connectedDebugAndroidTest --stacktrace --console=plain

      - name: Upload Room 2.8.5 Android test report and schema
        if: always() && (steps.request.outputs.validation_scope == 'full' || steps.request.outputs.validation_scope == 'database')
        uses: actions/upload-artifact@v6
        with:
          name: room2-android-test-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            spikes/android-db-validation/room2/build/reports/androidTests/connected/**
            spikes/android-db-validation/room2/build/outputs/androidTest-results/connected/**
            spikes/android-db-validation/room2/schemas/**
          if-no-files-found: warn
          retention-days: 7

      - name: Restore Gradle 9.4.1 for new DreamMemory app instrumentation tests
        if: steps.request.outputs.needs_build == 'true' && (steps.request.outputs.validation_scope == 'quick' || steps.request.outputs.validation_scope == 'app' || steps.request.outputs.validation_scope == 'full')
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Compile new DreamMemory app instrumentation tests
        if: steps.request.outputs.needs_build == 'true' && (steps.request.outputs.validation_scope == 'quick' || steps.request.outputs.validation_scope == 'app' || steps.request.outputs.validation_scope == 'full')
        shell: bash
        run: gradle :dm-app:assembleDebugAndroidTest --stacktrace --console=plain

      - name: Enable KVM for Android emulator
        if: steps.request.outputs.needs_build == 'true' && (steps.request.outputs.validation_scope == 'app' || steps.request.outputs.validation_scope == 'full')
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Prepare Bash instrumentation runner script
        if: steps.request.outputs.needs_build == 'true' && (steps.request.outputs.validation_scope == 'app' || steps.request.outputs.validation_scope == 'full')
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/run-app-instrumentation.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          snapshot_emulator() {
            echo "=== Device identity ==="
            adb devices -l || true
            adb shell getprop ro.build.version.sdk || true
            adb shell getprop ro.build.fingerprint || true
            adb shell getprop ro.product.model || true
            echo "=== Display and system settings ==="
            adb shell wm size || true
            adb shell wm density || true
            adb shell settings get system font_scale || true
            adb shell settings get system accelerometer_rotation || true
            adb shell settings get system user_rotation || true
            adb shell settings get secure navigation_mode || true
            adb shell settings get secure default_input_method || true
            adb shell settings get system system_locales || true
            adb shell ime list -s || true
            echo "=== IME/focus/window state ==="
            adb shell dumpsys input_method | grep -E 'mInputShown|mShowRequested|mCurFocusedWindow|mServedView|mImeLayeringTarget' | tail -n 160 || true
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp|mImeLayeringTarget|mInputMethod' | tail -n 160 || true
            echo "=== Activity/process state ==="
            adb shell dumpsys activity activities | tail -n 250 || true
            adb shell dumpsys activity processes | tail -n 180 || true
            adb shell ps -A | grep -E 'com[.]dreammemory[.]app|instrumentation' || true
            adb shell cat /data/anr/traces.txt 2>/dev/null | tail -n 300 || true
            echo "=== Recent app/test logcat ==="
            adb logcat -d -t 10000 | grep -E 'AndroidRuntime|ActivityTaskManager|InputMethodManager|InputMethodService|Instrumentation|FATAL EXCEPTION|ANR|com.dreammemory.app|TestRunner' | tail -n 1400 || true
          }

          prepare_emulator() {
            local sdk size density font rotation accelerometer rotation_mode rotation_value rotation_lock timezone nav window_anim transition_anim animator
            adb wait-for-device || return $?
            adb shell wm size 1080x1920 || return $?
            adb shell wm density 420 || return $?
            adb shell settings put system font_scale 1.0 || return $?
            adb shell settings put secure navigation_mode 2 || return $?
            adb shell settings put global window_animation_scale 0 || return $?
            adb shell settings put global transition_animation_scale 0 || return $?
            adb shell settings put global animator_duration_scale 0 || return $?
            adb shell settings put global auto_time_zone 0 || return $?
            # setprop is denied by the API 35 emulator's property policy; use
            # AlarmManager's supported shell command to change the active zone.
            adb shell cmd alarm set-timezone Asia/Shanghai || return $?
            adb shell input keyevent 111 >/dev/null 2>&1 || true

            # SetupWizard can rewrite the rotation setting during first boot.
            # The AVD's virtual accelerometer is disabled before launch; apply the
            # final lock only after the other first-boot settings have settled.
            rotation_lock=""
            for attempt in $(seq 1 15); do
              adb shell settings put system accelerometer_rotation 0 || return $?
              adb shell settings put system user_rotation 0 || return $?
              adb shell wm user-rotation lock 0 || return $?
              rotation_lock="$(adb shell wm user-rotation | tr -d '\r')"
              accelerometer="$(adb shell settings get system accelerometer_rotation | tr -d '\r')"
              rotation="$(adb shell settings get system user_rotation | tr -d '\r')"
              if [[ "$rotation_lock" == "lock 0" && "$accelerometer" == "0" && "$rotation" == "0" ]]; then
                echo "Portrait lock verified on attempt $attempt"
                break
              fi
              echo "Portrait lock attempt $attempt: wm=$rotation_lock accelerometer_rotation=$accelerometer user_rotation=$rotation"
              sleep 1
            done

            sdk="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
            size="$(adb shell wm size)"
            density="$(adb shell wm density)"
            font="$(adb shell settings get system font_scale | tr -d '\r')"
            rotation="$(adb shell settings get system user_rotation | tr -d '\r')"
            accelerometer="$(adb shell settings get system accelerometer_rotation | tr -d '\r')"
            rotation_lock="$(adb shell wm user-rotation | tr -d '\r')"
            rotation_state="$(adb shell dumpsys window | grep -m1 -o 'mUserRotationMode=[A-Z_]* mUserRotation=ROTATION_[0-9]' || true)"
            timezone="$(adb shell getprop persist.sys.timezone | tr -d '\r')"
            nav="$(adb shell settings get secure navigation_mode | tr -d '\r')"
            window_anim="$(adb shell settings get global window_animation_scale | tr -d '\r')"
            transition_anim="$(adb shell settings get global transition_animation_scale | tr -d '\r')"
            animator="$(adb shell settings get global animator_duration_scale | tr -d '\r')"
            [[ "$sdk" == "35" ]] || { echo "Expected API 35 emulator, got $sdk"; return 1; }
            [[ "$size" == *"1080x1920"* ]] || { echo "Unexpected standard display size: $size"; return 1; }
            [[ "$density" == *"420"* ]] || { echo "Unexpected standard display density: $density"; return 1; }
            [[ "$font" == "1.0" ]] || { echo "Unexpected font scale: $font"; return 1; }
            [[ "$rotation" == "0" ]] || { echo "Expected portrait rotation 0, got $rotation"; return 1; }
            [[ "$accelerometer" == "0" && "$rotation_lock" == "lock 0" ]] || {
              echo "Portrait lock is not active; accelerometer_rotation=$accelerometer wm_user_rotation=$rotation_lock"
              return 1
            }
            [[ "$rotation_state" == "mUserRotationMode=USER_ROTATION_LOCKED mUserRotation=ROTATION_0" ]] || {
              echo "WindowManager portrait lock not active: $rotation_state"
              return 1
            }
            [[ "$timezone" == "Asia/Shanghai" ]] || { echo "Unexpected emulator timezone: $timezone"; return 1; }
            [[ "$nav" == "2" ]] || { echo "Expected gesture navigation mode 2, got $nav"; return 1; }
            [[ "$window_anim" == "0" && "$transition_anim" == "0" && "$animator" == "0" ]] || {
              echo "Unexpected animation scales: window=$window_anim transition=$transition_anim animator=$animator"
              return 1
            }
            echo "Standard emulator baseline verified: API 35 / Pixel 2 profile / 1080x1920 / 420dpi / fontScale 1.0 / portrait locked / gesture navigation / Asia-Shanghai timezone / animations off"
          }

          prepare_emulator || { status=$?; snapshot_emulator; exit "$status"; }
          test_args=()
          if [[ -n "${INSTRUMENTATION_CLASS:-}" ]]; then
            echo "Running targeted instrumentation selector: $INSTRUMENTATION_CLASS"
            test_args+=("-Pandroid.testInstrumentationRunnerArguments.class=$INSTRUMENTATION_CLASS")
          else
            echo "Running the complete instrumentation suite."
          fi
          if timeout --signal=TERM --kill-after=30s 5m gradle :dm-app:connectedDebugAndroidTest "${test_args[@]}" --stacktrace --console=plain; then
            if [[ "${VALIDATION_SCOPE:-app}" == "full" ]]; then
              sh "$RUNNER_TEMP/short-screen-matrix.sh"
            fi
          else
            test_status=$?
            mkdir -p dm-app/build/diagnostics
            {
              echo "Instrumentation failed with exit code $test_status"
              snapshot_emulator
            } | tee dm-app/build/diagnostics/instrumentation-failure.txt
            exit "$test_status"
          fi
          SCRIPT
          chmod +x "$RUNNER_TEMP/run-app-instrumentation.sh"

      - name: Run app instrumentation and compact-screen matrix in one emulator session
        if: steps.request.outputs.needs_build == 'true' && (steps.request.outputs.validation_scope == 'app' || steps.request.outputs.validation_scope == 'full')
        timeout-minutes: 28
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VALIDATION_SCOPE: ${{ steps.request.outputs.validation_scope }}
          INSTRUMENTATION_CLASS: ${{ steps.request.outputs.instrumentation_class }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash "$RUNNER_TEMP/run-app-instrumentation.sh"
          pre-emulator-launch-script: |
            AVD_CONFIG="${ANDROID_AVD_HOME:-$HOME/.android/avd}/test.avd/config.ini"
            test -f "$AVD_CONFIG"
            if grep -q '^hw.sensor.accelerometer=' "$AVD_CONFIG"; then
              sed -i 's/^hw.sensor.accelerometer=.*/hw.sensor.accelerometer=no/' "$AVD_CONFIG"
            else
              printf '\nhw.sensor.accelerometer=no\n' >> "$AVD_CONFIG"
            fi
            grep '^hw.sensor.accelerometer=' "$AVD_CONFIG"

      - name: Upload new DreamMemory app test reports and Room schema
        if: always() && (steps.request.outputs.validation_scope == 'app' || steps.request.outputs.validation_scope == 'full')
        uses: actions/upload-artifact@v6
        with:
          name: dm-app-test-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dm-app/schemas/**
            dm-app/build/reports/**
            dm-app/build/outputs/androidTest-results/connected/**
            dm-app/build/diagnostics/**
          if-no-files-found: warn
          retention-days: 7

      # The active DreamMemory app Room schema is stored under dm-app/schemas and
      # uploaded with the instrumentation reports for review. The frozen legacy :app
      # module is intentionally excluded from settings.gradle.kts and all build tasks.

      - name: Encrypt APK and source ZIP for isolated publishing runner
        if: steps.request.outputs.needs_build == 'true' && steps.request.outputs.validation_scope != 'database' && steps.request.outputs.deliver_apk != 'no'
        env:
          ARTIFACT_PASSWORD: ${{ secrets.DREAMMEMORY_ARTIFACT_PASSWORD }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_PASSWORD:-}" || { echo "Missing repository secret DREAMMEMORY_ARTIFACT_PASSWORD"; exit 1; }
          apk="$(find dm-app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk" && test -s "$apk" || { echo "New :dm-app APK not found"; exit 1; }
          mkdir -p "$RUNNER_TEMP/dreammemory-transfer"
          source_zip="$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-source.zip"
          test -s "$source_zip" || { echo "Exact source ZIP is missing"; exit 1; }
          tar -czf "$RUNNER_TEMP/dreammemory-transfer/dreammemory-package.tar.gz" "$apk" "$source_zip"
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$RUNNER_TEMP/dreammemory-transfer/dreammemory-package.tar.gz" \
            -out "$RUNNER_TEMP/dreammemory-transfer/dreammemory-package.enc" \
            -pass env:ARTIFACT_PASSWORD

      - name: Upload encrypted release package only
        if: steps.request.outputs.needs_build == 'true' && steps.request.outputs.validation_scope != 'database' && steps.request.outputs.deliver_apk != 'no'
        uses: actions/upload-artifact@v6
        with:
          name: encrypted-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dreammemory-transfer/dreammemory-package.enc
          if-no-files-found: error
          retention-days: 1

  deliver-private-branch-apk:
    needs: build
    if: needs.build.outputs.needs_build == 'true' && needs.build.outputs.validation_scope != 'database' && needs.build.outputs.source_ref != 'main' && needs.build.outputs.deliver_apk != 'no'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The publisher runner never checks out or executes project source code.
      - name: Download encrypted APK package
        uses: actions/download-artifact@v6
        with:
          name: encrypted-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Decrypt package, apply stable test signature and verify debug APK
        env:
          ARTIFACT_PASSWORD: ${{ secrets.DREAMMEMORY_ARTIFACT_PASSWORD }}
          DREAMMEMORY_KEYSTORE_B64: ${{ secrets.DREAMMEMORY_KEYSTORE_B64 }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_PASSWORD:-}" || { echo "Missing repository secret DREAMMEMORY_ARTIFACT_PASSWORD"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -salt \
            -in "$RUNNER_TEMP/encrypted/dreammemory-package.enc" \
            -out "$RUNNER_TEMP/dreammemory-package.tar.gz" \
            -pass env:ARTIFACT_PASSWORD
          mkdir -p "$RUNNER_TEMP/package"
          tar -xzf "$RUNNER_TEMP/dreammemory-package.tar.gz" -C "$RUNNER_TEMP/package"
          # Android Gradle names APKs after the module (dm-app-debug.apk), not necessarily app-debug.apk.
          apk_path="$(find "$RUNNER_TEMP/package" -type f -name '*.apk' -print -quit)"
          source_zip="$(find "$RUNNER_TEMP/package" -type f -name "DreamMemory-$SOURCE_SHA-source.zip" -print -quit)"
          test -n "$apk_path" && test -s "$apk_path" || { echo "APK missing from encrypted package"; exit 1; }
          test -n "$source_zip" && test -s "$source_zip" || { echo "Source ZIP missing from encrypted package"; exit 1; }
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -x "$apksigner" ]; then
            yes | sdkmanager --licenses > /dev/null || true
            sdkmanager "build-tools;36.0.0"
          fi
          test -n "${DREAMMEMORY_KEYSTORE_B64:-}" || { echo "Missing repository secret DREAMMEMORY_KEYSTORE_B64"; exit 1; }
          printf '%s' "$DREAMMEMORY_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/dreammemory-debug.keystore"
          chmod 600 "$RUNNER_TEMP/dreammemory-debug.keystore"
          "$apksigner" sign --ks "$RUNNER_TEMP/dreammemory-debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android "$apk_path"
          "$apksigner" verify --verbose "$apk_path"
          rm -f "$RUNNER_TEMP/dreammemory-debug.keystore"
          cp "$apk_path" "$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-debug.apk"
          cp "$source_zip" "$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-source.zip"

      - name: Publish APK to private source repository release
        if: needs.build.outputs.deliver_apk == 'yes'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "Missing repository secret PRIVATE_RELEASE_TOKEN"; exit 1; }
          apk="$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-debug.apk"
          test -s "$apk" || { echo "Verified debug APK is missing"; exit 1; }
          tag="private-test-${SOURCE_SHA:0:12}-${RUN_ID}-${RUN_ATTEMPT}"
          source_zip="$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-source.zip"
          test -s "$source_zip" || { echo "Verified source ZIP is missing"; exit 1; }
          gh release create "$tag" "$apk" "$source_zip" \
            --repo maoni66/DreamMemory \
            --target "$SOURCE_SHA" \
            --title "DreamMemory private test APK ${SOURCE_SHA:0:12}" \
            --notes "Private test build from exact source commit $SOURCE_SHA. This is an installable Android Debug APK produced by assembleDebug and verified on the isolated delivery runner. It is not a release-signed production build. No source branch or main-branch writes were performed by this delivery job."
  
  verify-main-apk:
    needs: build
    if: needs.build.outputs.needs_build == 'true' && needs.build.outputs.validation_scope != 'database' && needs.build.outputs.source_ref == 'main' && needs.build.outputs.deliver_apk == 'verify'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download encrypted APK package
        uses: actions/download-artifact@v6
        with:
          name: encrypted-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Decrypt package and verify APK without publishing
        env:
          ARTIFACT_PASSWORD: ${{ secrets.DREAMMEMORY_ARTIFACT_PASSWORD }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_PASSWORD:-}" || { echo "Missing repository secret DREAMMEMORY_ARTIFACT_PASSWORD"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -salt \
            -in "$RUNNER_TEMP/encrypted/dreammemory-package.enc" \
            -out "$RUNNER_TEMP/dreammemory-package.tar.gz" \
            -pass env:ARTIFACT_PASSWORD
          mkdir -p "$RUNNER_TEMP/package"
          tar -xzf "$RUNNER_TEMP/dreammemory-package.tar.gz" -C "$RUNNER_TEMP/package"
          apk_path="$(find "$RUNNER_TEMP/package" -type f -name '*.apk' -print -quit)"
          schema_path="$(find "$RUNNER_TEMP/package" -type f -name '*.json' -path '*/dm-app/schemas/*' -print -quit)"
          test -n "$apk_path" && test -s "$apk_path" || { echo "APK missing from encrypted package"; exit 1; }
          test -n "$schema_path" && test -s "$schema_path" || { echo "Room schema missing from encrypted package"; exit 1; }
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;36.0.0"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk_path"
          echo "Verified non-published main-branch APK for source SHA $SOURCE_SHA"

  publish:
    needs: build
    if: needs.build.outputs.needs_build == 'true' && needs.build.outputs.validation_scope != 'database' && needs.build.outputs.source_ref == 'main' && needs.build.outputs.deliver_apk == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # This is a fresh runner. It does not check out or execute project source code.
      - name: Download encrypted APK
        uses: actions/download-artifact@v6
        with:
          name: encrypted-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted

      - name: Decrypt APK and Room schema on isolated publishing runner
        env:
          ARTIFACT_PASSWORD: ${{ secrets.DREAMMEMORY_ARTIFACT_PASSWORD }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_PASSWORD:-}" || { echo "Missing repository secret DREAMMEMORY_ARTIFACT_PASSWORD"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -salt \
            -in "$RUNNER_TEMP/encrypted/dreammemory-package.enc" \
            -out "$RUNNER_TEMP/dreammemory-package.tar.gz" \
            -pass env:ARTIFACT_PASSWORD
          mkdir -p "$RUNNER_TEMP/package"
          tar -xzf "$RUNNER_TEMP/dreammemory-package.tar.gz" -C "$RUNNER_TEMP/package"
          apk_path="$(find "$RUNNER_TEMP/package" -type f -name '*.apk' -print -quit)"
          source_zip="$(find "$RUNNER_TEMP/package" -type f -name "DreamMemory-$SOURCE_SHA-source.zip" -print -quit)"
          test -n "$apk_path" && test -s "$apk_path" || { echo "APK missing from encrypted package"; exit 1; }
          test -n "$source_zip" && test -s "$source_zip" || { echo "Source ZIP missing from encrypted package"; exit 1; }
          cp "$apk_path" "$RUNNER_TEMP/app-debug.apk"
          cp "$source_zip" "$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-source.zip"
          test -s "$RUNNER_TEMP/app-debug.apk"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;36.0.0"

      # Signing material is exposed only to this step, after project build code is gone.
      - name: Sign and verify APK
        env:
          DREAMMEMORY_KEYSTORE_B64: ${{ secrets.DREAMMEMORY_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DREAMMEMORY_KEYSTORE_B64:-}" || { echo "Missing repository secret DREAMMEMORY_KEYSTORE_B64"; exit 1; }
          printf '%s' "$DREAMMEMORY_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/dreammemory-debug.keystore"
          chmod 600 "$RUNNER_TEMP/dreammemory-debug.keystore"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$apksigner" || { echo "apksigner not found"; exit 1; }
          "$apksigner" sign --ks "$RUNNER_TEMP/dreammemory-debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android "$RUNNER_TEMP/app-debug.apk"
          "$apksigner" verify --verbose "$RUNNER_TEMP/app-debug.apk"
          rm -f "$RUNNER_TEMP/dreammemory-debug.keystore"

      # The release token is exposed only to the final publishing step.
      - name: Publish APK to private DreamMemory release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "Missing repository secret PRIVATE_RELEASE_TOKEN"; exit 1; }
          test -s "$RUNNER_TEMP/app-debug.apk" || { echo "Signed APK not found"; exit 1; }

          # The publisher runner never executes project build scripts. It only publishes
          # the already-built, signed APK and exact source archive.
          tag="build-${SOURCE_SHA:0:12}-${RUN_ID}-${RUN_ATTEMPT}"
          gh release create "$tag" "$RUNNER_TEMP/app-debug.apk" "$RUNNER_TEMP/DreamMemory-$SOURCE_SHA-source.zip" \
            --repo maoni66/DreamMemory \
            --target "$SOURCE_SHA" \
            --title "DreamMemory build ${SOURCE_SHA:0:12} (run ${RUN_ID}.${RUN_ATTEMPT})" \
            --notes "Automated private APK build from source commit ${SOURCE_SHA}. JVM unit tests passed; APK was password-encrypted during transfer, decrypted on an isolated runner, signed, and signature-verified. Private release for DreamMemory."
